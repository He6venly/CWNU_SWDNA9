[build]
  command = "npm run check && npm --prefix apps/web run build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "24"
  NPM_VERSION = "11"

[functions]
  directory = "netlify/functions"

# API custom path는 functions/api.ts의 config.path로 관리.
# 사용자 웹앱은 해시 화면 전환을 사용하므로 SPA rewrite가 필요하지 않음.
